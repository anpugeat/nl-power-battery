services:
  db:
    image: postgres:18
    container_name: power-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"    # reachable from your machine only
    volumes:
      - pgdata:/var/lib/postgresql                 # the data lives here and survives restarts
      - ./db/init:/docker-entrypoint-initdb.d:ro   # SQL files run once, on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: